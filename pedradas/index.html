  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #1c1f26;
      --primary: #e07a38;
      --primary-hover: #f08b49;
      --accent: #d45d28;
      --text: #ffffff;
      --text-muted: #9da5b4;
      --border: rgba(224, 122, 56, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at center, rgba(224, 122, 56, 0.08) 0%, transparent 70%);
    }

    .player-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 8px 24px rgba(224, 122, 56, 0.3);
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.03);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-friday {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(212, 93, 40, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.85; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 0.85; transform: scale(0.98); }
    }

    .track-info {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .track-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
    }

    .track-artist {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    audio {
      width: 100%;
      margin-bottom: 24px;
      outline: none;
      border-radius: 8px;
    }

    audio::-webkit-media-controls-panel {
      background-color: #2a2e38;
    }

    .volume-control {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .volume-btn {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #2a2e38;
      color: var(--primary);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .volume-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .volume-slider {
      accent-color: var(--primary);
      cursor: pointer;
      flex: 1;
    }

    .volume-value {
      min-width: 42px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: right;
    }

    .playlist-container {
      width: 100%;
    }

    .playlist-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .playlist {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .playlist::-webkit-scrollbar {
      width: 6px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .playlist li {
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .playlist li:hover {
      background-color: rgba(255, 255, 255, 0.07);
      transform: translateX(2px);
    }

    .playlist li.active {
      background-color: rgba(224, 122, 56, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .playlist li .track-number {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 12px;
    }

    .countdown-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 17, 21, 0.94);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .countdown-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .countdown-card {
      background: var(--card-bg);
      border: 2px solid var(--primary);
      padding: 32px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(224, 122, 56, 0.4);
      animation: pulse 1.5s infinite;
      max-width: 90%;
    }

    .countdown-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .countdown-number {
      font-size: 3rem;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(224, 122, 56, 0.8);
      display: inline-block;
      margin-left: 6px;
      animation: pop 0.4s ease;
    }

    .start-btn {
      margin-top: 18px;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(224, 122, 56, 0.5);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(224, 122, 56, 0.8);
    }

    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      80% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
      width: 100%;
    }

    .ctrl-btn {
      background: #2a2e38;
      color: var(--primary);
      border: 1px solid var(--border);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .ctrl-btn:hover {
      background: var(--primary);
      color: #fff;
      transform: scale(1.08);
      box-shadow: 0 4px 15px rgba(224, 122, 56, 0.5);
    }

    .play-pause-btn {
      width: 56px;
      height: 56px;
      font-size: 1.4rem;
    }

    .whatsapp-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background-color: #25d366;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    .whatsapp-btn:hover {
      background-color: #20ba5a;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.5);
    }

    #pip-canvas {
      display: none;
    }
  </style>
</head>

    const currentArtist = document.getElementById('current-artist');
    const currentAlbum = document.getElementById('current-album');
    const playlistElement = document.getElementById('playlist');
    const fridayTag = document.getElementById('friday-tag');

    const today = new Date();
    const isFriday = today.getDay() === 5;

    function renderPlaylist() {
      playlistElement.innerHTML = '';

      playlist.forEach((track, index) => {
        const li = document.createElement('li');
        
        const spanNum = document.createElement('span');
        spanNum.className = 'track-number';
        spanNum.textContent = String(index + 1).padStart(2, '0');

        const spanTitle = document.createElement('span');
        spanTitle.textContent = `${track.musica} - ${track.cantor}`;

        li.appendChild(spanNum);
        li.appendChild(spanTitle);

        li.addEventListener('click', () => loadTrack(index));
        playlistElement.appendChild(li);
      });
    }

    // --- Suporte da MediaSession API para Chrome/PiP ---
    function updateMediaSession() {
      if (!('mediaSession' in navigator)) return;

      const track = playlist[currentTrackIndex];
      if (!track) return;

      // Resolve o caminho completo/absoluto da imagem de capa
      //const logoUrl = new URL('\\Atividades\\pedradas\\logo_inaldo.jpg', window.location.href).href;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.musica || 'Desconhecido',
        artist: track.cantor || 'Artista Desconhecido',
        album: track.album || 'Álbum Desconhecido',
        artwork: [
          { src: LOGO_BASE64, sizes: '96x96', type: 'image/jpeg' },
          { src: LOGO_BASE64, sizes: '128x128', type: 'image/jpeg' },
          { src: LOGO_BASE64, sizes: '192x192', type: 'image/jpeg' },
          { src: LOGO_BASE64, sizes: '512x512', type: 'image/jpeg' }
        ]
      });

      navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
      navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
      navigator.mediaSession.setActionHandler('previoustrack', playPrevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', playNextTrack);
    }

    function loadTrack(index) {
      if (!playlist[index]) return;

      currentTrackIndex = index;
      const track = playlist[index];
      audioPlayer.src = track.file;
      currentTitle.textContent = track.musica;
      currentArtist.textContent = track.cantor || 'Cantor não informado';
      currentAlbum.textContent = track.album || 'Álbum não informado';

      const items = playlistElement.querySelectorAll('li');
      items.forEach((item, idx) => {
        if (idx === index) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });

      updateMediaSession();
    }

    function playNextTrack() {
      if (!playlist.length) return;
      const nextIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(nextIndex);
      audioPlayer.play().catch(e => console.log("Erro ao tocar próxima:", e));
    }

    function playPrevTrack() {
      if (!playlist.length) return;
      const prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(prevIndex);
      audioPlayer.play().catch(e => console.log("Erro ao tocar anterior:", e));
    }

    function togglePlayPause() {
      if (!playlist.length) return;

      if (audioPlayer.paused) {
        audioPlayer.play().catch(e => console.log("Erro ao reproduzir:", e));
      } else {
        audioPlayer.pause();
      }
    }

    function updatePlayPauseButton() {
      const isPaused = audioPlayer.paused;
      playPauseBtn.textContent = isPaused ? '▶' : '⏸';
      playPauseBtn.title = isPaused ? 'Reproduzir' : 'Pausar';
      playPauseBtn.setAttribute('aria-label', isPaused ? 'Reproduzir' : 'Pausar');
    }

    function updateVolumeControl() {
      const volumePercent = Math.round(audioPlayer.volume * 100);
      volumeSlider.value = volumePercent;
      volumeValue.textContent = `${volumePercent}%`;
      volumeBtn.textContent = audioPlayer.muted || volumePercent === 0 ? '🔇' : '🔊';
      volumeBtn.title = audioPlayer.muted || volumePercent === 0 ? 'Ativar som' : 'Silenciar';
      volumeBtn.setAttribute('aria-label', volumeBtn.title);
    }

    function setVolume() {
      audioPlayer.volume = Number(volumeSlider.value) / 100;
      audioPlayer.muted = audioPlayer.volume === 0;
      updateVolumeControl();
    }

    function toggleMute() {
      audioPlayer.muted = !audioPlayer.muted;
      updateVolumeControl();
    }

    function shareOnWhatsApp() {
      const currentTrack = playlist[currentTrackIndex] ? playlist[currentTrackIndex].musica : "Pedradas do Inaldo";
      const text = `🔥 Ouve essa pedrada! Tô escutando "${currentTrack}" nas Pedradas do Inaldo!`;
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + '\n' + window.location.href)}`;
      window.open(url, '_blank');
    }

    if (prevBtn) prevBtn.addEventListener('click', playPrevTrack);
    if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);
    if (nextBtn) nextBtn.addEventListener('click', playNextTrack);
    if (shareWhatsappBtn) shareWhatsappBtn.addEventListener('click', shareOnWhatsApp);
    if (volumeSlider) volumeSlider.addEventListener('input', setVolume);
    if (volumeBtn) volumeBtn.addEventListener('click', toggleMute);

    audioPlayer.addEventListener('play', () => {
      updatePlayPauseButton();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
    });

    audioPlayer.addEventListener('pause', () => {
      updatePlayPauseButton();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    });

    // --- Lógica do Picture in Picture sem canvas clicável ---
    const pipCanvas = document.getElementById('pip-canvas');
    const pipVideo = document.getElementById('pip-video');
    const pipContext = pipCanvas.getContext('2d', { willReadFrequently: true });
    let pipActive = false;
    let logoImg = null;
    let logoLoaded = false;
    let animationFrameId = null;
    let mediaStream = null;

    function loadLogoForPip() {
      logoImg = new Image();
      logoImg.onload = () => { 
        logoLoaded = true; 
        console.log('✓ Logo em Base64 carregada no Canvas com sucesso!');
      };
      logoImg.onerror = (e) => { 
        logoLoaded = false; 
        console.error('Erro ao carregar logo em Base64', e);
      };
      
      // Atribui a string Base64 diretamente como origem
      logoImg.src = LOGO_BASE64;
    }

    function drawPipCanvas() {
      const ctx = pipContext;
      const size = 640;

      // Fundo com gradiente
      const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size);
      gradient.addColorStop(0, 'rgba(15, 17, 21, 0.9)');
      gradient.addColorStop(1, 'rgba(15, 17, 21, 1)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Desenha a logo
      if (logoLoaded && logoImg) {
        try {
          ctx.save();
          ctx.beginPath();
          ctx.arc(size/2, size/2 - 30, 140, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(logoImg, size/2 - 140, size/2 - 170, 280, 280);
          ctx.restore();

          ctx.strokeStyle = 'rgba(224, 122, 56, 0.8)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(size/2, size/2 - 30, 140, 0, Math.PI * 2);
          ctx.stroke();
        } catch (e) {
          console.log('Erro ao desenhar logo:', e);
        }
      }

      // Título e Artista
      ctx.font = 'bold 22px "Segoe UI", Arial';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(currentTitle.textContent, size/2, size/2 + 130);

      ctx.font = '16px "Segoe UI", Arial';
      ctx.fillStyle = '#9da5b4';
      ctx.fillText(currentArtist.textContent, size/2, size/2 + 165);

      if (pipActive) {
        animationFrameId = requestAnimationFrame(drawPipCanvas);
      }
    }

    async function togglePictureInPicture() {
      if (!document.pictureInPictureEnabled) {
        alert('Picture in Picture não é suportado neste navegador');
        return;
      }

      try {
        if (pipActive) {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          }
          pipActive = false;
          pipBtn.style.opacity = '1';

          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());

          pipVideo.srcObject = null;
        } else {
          pipActive = true;
          drawPipCanvas();

          if (typeof pipCanvas.captureStream === 'function') {
            mediaStream = pipCanvas.captureStream(30);
            pipVideo.srcObject = mediaStream;
            
            await new Promise(resolve => setTimeout(resolve, 100));

            try {
              await pipVideo.requestPictureInPicture();
              pipBtn.style.opacity = '0.5';

              try {
                await pipVideo.play();
              } catch (e) {
                console.log('Aviso ao reproduzir stream:', e);
              }
            } catch (e) {
              console.error('Erro ao entrar em Picture-in-Picture:', e);
              pipActive = false;
              pipBtn.style.opacity = '1';
              if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            }
          } else {
            alert('Canvas capture não é suportado neste navegador');
            pipActive = false;
          }
        }
      } catch (error) {
        console.error('Erro ao ativar Picture in Picture:', error);
        pipActive = false;
        pipBtn.style.opacity = '1';
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
      }
    }

    document.addEventListener('leavepictureinpicture', () => {
      pipActive = false;
      pipBtn.style.opacity = '1';
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      pipVideo.srcObject = null;
    });

    if (pipBtn) {
      pipBtn.addEventListener('click', togglePictureInPicture);
    }

    loadLogoForPip();
    audioPlayer.addEventListener('ended', playNextTrack);

    function loadPlaylist() {
      playlist = playlist.filter(track => track && track.musica && track.file);
      playlist = [
        ...playlist.filter(track => track.isFridayTrack),
        ...playlist.filter(track => !track.isFridayTrack)
      ];
      renderPlaylist();

      if (!playlist.length) {
        currentTitle.textContent = 'Nenhuma música encontrada';
        return;
      }

      fridayTag.style.display = isFriday && playlist[0].isFridayTrack ? 'inline-block' : 'none';
      loadTrack(0);
    }

    loadPlaylist();
    updateVolumeControl();

    let countdownValue = 3;
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownContent = document.getElementById('countdown-content');
    const startBtn = document.getElementById('start-btn');

    function startCountdown() {
      audioPlayer.play().then(() => {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }).catch(err => console.log("Aviso de inicialização de áudio:", err));

      countdownContent.innerHTML = 'Segura essa <br>pedrada em <br><span id="countdown-num" class="countdown-number">3</span>';
      const countdownNumEl = document.getElementById('countdown-num');

      const interval = setInterval(() => {
        countdownValue--;
        if (countdownValue > 0) {
          countdownNumEl.textContent = countdownValue;
          countdownNumEl.style.animation = 'none';
          void countdownNumEl.offsetWidth;
          countdownNumEl.style.animation = 'pop 0.4s ease';
        } else {
          clearInterval(interval);
          countdownOverlay.classList.add('hidden');
          
          audioPlayer.play().catch(error => {
            console.log("Erro ao iniciar a música:", error);
          });
        }
      }, 1000);
    }

    if (startBtn) {
      startBtn.addEventListener('click', startCountdown);
    }
  </script>
</body>
</html>
